spring.application.name=backend

# ===============================
# 1. CONFIGURACION MYSQL (portable, embebido junto a la app de escritorio)
# ===============================
# El shell de Tauri es quien arranca este mysqld como sidecar, en un puerto propio
# (no el 3306 estandar, para no chocar con un MySQL que el usuario ya tenga instalado)
# y con un datadir dedicado en %AppData%\MercadoApp\mysql-data.
spring.datasource.url=jdbc:mysql://127.0.0.1:${DB_PORT:33061}/${DB_NAME:mercado_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:mercado_user}
spring.datasource.password=${DB_PASSWORD:mercado_pass}

# ===============================
# 2. CONFIGURACION JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===============================
# 3. LIMITES DE SUBIDA (logo de empresa, restauracion de backups)
# ===============================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
