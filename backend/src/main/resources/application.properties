spring.application.name=backend
# ===============================
# 1. CONFIGURACION MYSQL (local, via docker compose up db)
# ===============================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mercado_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:mercado_user}
spring.datasource.password=${DB_PASSWORD:mercado_pass}

# ===============================
# 2. CONFIGURACION JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# "update" lee tus clases Java y crea/actualiza las tablas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# 3. LIMITES DE SUBIDA (logo de empresa, restauracion de backups)
# ===============================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
