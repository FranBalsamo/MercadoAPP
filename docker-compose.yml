services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: America/Argentina/Buenos_Aires
      MYSQL_DATABASE: ${DB_NAME:-mercado_db}
      MYSQL_USER: ${DB_USER:-mercado_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mercado_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-mercado_root_pass}
    volumes:
      - mercado_db_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-mercado_root_pass}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-mercado_db}
      DB_USER: ${DB_USER:-mercado_user}
      DB_PASSWORD: ${DB_PASSWORD:-mercado_pass}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ${BACKUP_HOST_PATH:-./backend_backups}:/app/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  mercado_db_data:
